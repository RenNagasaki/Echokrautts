# ============================================================================
#  Build the image on demand, from any branch — no release needed.
#
#  Actions → "Docker build (manual)" → Run workflow → pick the branch (main by
#  default), the variant and a tag. Pushes to GHCR like the release workflow,
#  it just does not need a release to exist.
#
#    ghcr.io/rennagasaki/echokrautts:<tag>        (CUDA)
#    ghcr.io/rennagasaki/echokrautts:<tag>-cpu    (CPU)
#
#  Default tag is "main", so re-running simply refreshes ghcr…:main. The
#  `latest` tags belong to releases and are never touched here.
#
#  Runtimes: CPU ~10 min, CUDA ~30-45 min.
# ============================================================================
name: Docker build (manual)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Image variant to build"
        required: true
        default: cuda
        type: choice
        options: [cuda, cpu, both]
      tag:
        description: "Image tag (CPU build appends -cpu)"
        required: true
        default: main
        type: string

jobs:
  # The matrix is computed here because the `matrix` context is not available
  # in a job-level `if`, so variants cannot be filtered any other way.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        run: |
          set -euo pipefail
          CPU='{"variant":"cpu","suffix":"-cpu","torch_index":"https://download.pytorch.org/whl/cpu"}'
          CUDA='{"variant":"cuda","suffix":"","torch_index":"https://download.pytorch.org/whl/cu128"}'
          case "${{ inputs.variant }}" in
            cuda) M="{\"include\":[$CUDA]}" ;;
            cpu)  M="{\"include\":[$CPU]}" ;;
            both) M="{\"include\":[$CUDA,$CPU]}" ;;
            *)    echo "unknown variant"; exit 1 ;;
          esac
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "$M"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - name: Free disk space
        # A stock runner does not have room for the ~8 GB CUDA image next to
        # the preinstalled toolchains.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - uses: actions/checkout@v4

      - name: Resolve image name
        id: meta
        # GHCR rejects upper-case paths and the owner is "RenNagasaki".
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${OWNER}/echokrautts" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ inputs.tag }}${{ matrix.suffix }}
            ${{ steps.meta.outputs.image }}:sha-${{ github.sha }}${{ matrix.suffix }}
          build-args: |
            TORCH_INDEX_URL=${{ matrix.torch_index }}
            ECHOKRAUTTS_VERSION=${{ inputs.tag }}
            VARIANT=${{ matrix.variant }}
          provenance: false
          # Shares the release workflow's cache scope: a manual build right
          # after a release only rebuilds what actually changed.
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
